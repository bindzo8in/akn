name: Build & Deploy to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ steps.meta.outputs.tags }}

          labels: |
            ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          secrets: |
            NEXT_PUBLIC_BUSINESS_NAME=${{ secrets.NEXT_PUBLIC_BUSINESS_NAME }}
            NEXT_PUBLIC_TAGLINE=${{ secrets.NEXT_PUBLIC_TAGLINE }}
            NEXT_PUBLIC_ENGINEER_NAME=${{ secrets.NEXT_PUBLIC_ENGINEER_NAME }}
            NEXT_PUBLIC_ENGINEER_DEGREE=${{ secrets.NEXT_PUBLIC_ENGINEER_DEGREE }}
            NEXT_PUBLIC_PHONE_PRIMARY=${{ secrets.NEXT_PUBLIC_PHONE_PRIMARY }}
            NEXT_PUBLIC_PHONE_SECONDARY=${{ secrets.NEXT_PUBLIC_PHONE_SECONDARY }}
            NEXT_PUBLIC_EMAIL=${{ secrets.NEXT_PUBLIC_EMAIL }}
            NEXT_PUBLIC_LOCATION_PRIMARY=${{ secrets.NEXT_PUBLIC_LOCATION_PRIMARY }}
            NEXT_PUBLIC_LOCATION_SECONDARY=${{ secrets.NEXT_PUBLIC_LOCATION_SECONDARY }}
            NEXT_PUBLIC_LOCATION_STATE=${{ secrets.NEXT_PUBLIC_LOCATION_STATE }}
            NEXT_PUBLIC_ADDRESS_STREET=${{ secrets.NEXT_PUBLIC_ADDRESS_STREET }}
            NEXT_PUBLIC_ADDRESS_FULL=${{ secrets.NEXT_PUBLIC_ADDRESS_FULL }}
            NEXT_PUBLIC_INSTAGRAM_HANDLE=${{ secrets.NEXT_PUBLIC_INSTAGRAM_HANDLE }}
            NEXT_PUBLIC_INSTAGRAM_URL=${{ secrets.NEXT_PUBLIC_INSTAGRAM_URL }}
            NEXT_PUBLIC_YOUTUBE_HANDLE=${{ secrets.NEXT_PUBLIC_YOUTUBE_HANDLE }}
            NEXT_PUBLIC_YOUTUBE_URL=${{ secrets.NEXT_PUBLIC_YOUTUBE_URL }}
            NEXT_PUBLIC_WORKING_HOURS_WEEKDAY=${{ secrets.NEXT_PUBLIC_WORKING_HOURS_WEEKDAY }}
            NEXT_PUBLIC_WORKING_HOURS_SUNDAY=${{ secrets.NEXT_PUBLIC_WORKING_HOURS_SUNDAY }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_FOUNDED_YEAR=${{ secrets.NEXT_PUBLIC_FOUNDED_YEAR }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
            RESEND_TO_EMAIL=${{ secrets.RESEND_TO_EMAIL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Create VPS application directory
      # --------------------------------------------------

      - name: Prepare VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            mkdir -p "$HOME/apps/akn"

            docker network inspect web_network >/dev/null 2>&1 || \
              docker network create web_network


      # --------------------------------------------------
      # 3. Copy docker-compose.yml to VPS
      # --------------------------------------------------

      - name: Copy Docker Compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          source: "docker-compose.yml"
          target: "apps/akn"


      # --------------------------------------------------
      # 4. Deploy
      # --------------------------------------------------

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3

        env:
          NEXT_PUBLIC_BUSINESS_NAME: ${{ secrets.NEXT_PUBLIC_BUSINESS_NAME }}
          NEXT_PUBLIC_TAGLINE: ${{ secrets.NEXT_PUBLIC_TAGLINE }}
          NEXT_PUBLIC_ENGINEER_NAME: ${{ secrets.NEXT_PUBLIC_ENGINEER_NAME }}
          NEXT_PUBLIC_ENGINEER_DEGREE: ${{ secrets.NEXT_PUBLIC_ENGINEER_DEGREE }}
          NEXT_PUBLIC_PHONE_PRIMARY: ${{ secrets.NEXT_PUBLIC_PHONE_PRIMARY }}
          NEXT_PUBLIC_PHONE_SECONDARY: ${{ secrets.NEXT_PUBLIC_PHONE_SECONDARY }}
          NEXT_PUBLIC_EMAIL: ${{ secrets.NEXT_PUBLIC_EMAIL }}
          NEXT_PUBLIC_LOCATION_PRIMARY: ${{ secrets.NEXT_PUBLIC_LOCATION_PRIMARY }}
          NEXT_PUBLIC_LOCATION_SECONDARY: ${{ secrets.NEXT_PUBLIC_LOCATION_SECONDARY }}
          NEXT_PUBLIC_LOCATION_STATE: ${{ secrets.NEXT_PUBLIC_LOCATION_STATE }}
          NEXT_PUBLIC_ADDRESS_STREET: ${{ secrets.NEXT_PUBLIC_ADDRESS_STREET }}
          NEXT_PUBLIC_ADDRESS_FULL: ${{ secrets.NEXT_PUBLIC_ADDRESS_FULL }}
          NEXT_PUBLIC_INSTAGRAM_HANDLE: ${{ secrets.NEXT_PUBLIC_INSTAGRAM_HANDLE }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ secrets.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_YOUTUBE_HANDLE: ${{ secrets.NEXT_PUBLIC_YOUTUBE_HANDLE }}
          NEXT_PUBLIC_YOUTUBE_URL: ${{ secrets.NEXT_PUBLIC_YOUTUBE_URL }}
          NEXT_PUBLIC_WORKING_HOURS_WEEKDAY: ${{ secrets.NEXT_PUBLIC_WORKING_HOURS_WEEKDAY }}
          NEXT_PUBLIC_WORKING_HOURS_SUNDAY: ${{ secrets.NEXT_PUBLIC_WORKING_HOURS_SUNDAY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_FOUNDED_YEAR: ${{ secrets.NEXT_PUBLIC_FOUNDED_YEAR }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          envs: NEXT_PUBLIC_BUSINESS_NAME,NEXT_PUBLIC_TAGLINE,NEXT_PUBLIC_ENGINEER_NAME,NEXT_PUBLIC_ENGINEER_DEGREE,NEXT_PUBLIC_PHONE_PRIMARY,NEXT_PUBLIC_PHONE_SECONDARY,NEXT_PUBLIC_EMAIL,NEXT_PUBLIC_LOCATION_PRIMARY,NEXT_PUBLIC_LOCATION_SECONDARY,NEXT_PUBLIC_LOCATION_STATE,NEXT_PUBLIC_ADDRESS_STREET,NEXT_PUBLIC_ADDRESS_FULL,NEXT_PUBLIC_INSTAGRAM_HANDLE,NEXT_PUBLIC_INSTAGRAM_URL,NEXT_PUBLIC_YOUTUBE_HANDLE,NEXT_PUBLIC_YOUTUBE_URL,NEXT_PUBLIC_WORKING_HOURS_WEEKDAY,NEXT_PUBLIC_WORKING_HOURS_SUNDAY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_FOUNDED_YEAR,RESEND_API_KEY,RESEND_FROM_EMAIL,RESEND_TO_EMAIL,GHCR_USERNAME,GHCR_TOKEN

          script: |
            set -e

            mkdir -p "$HOME/apps/akn"

            cd "$HOME/apps/akn"

            echo "Logging into GHCR..."

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin

            echo "Creating production .env..."

            cat > .env <<EOF
            NEXT_PUBLIC_BUSINESS_NAME=$NEXT_PUBLIC_BUSINESS_NAME
            NEXT_PUBLIC_TAGLINE=$NEXT_PUBLIC_TAGLINE
            NEXT_PUBLIC_ENGINEER_NAME=$NEXT_PUBLIC_ENGINEER_NAME
            NEXT_PUBLIC_ENGINEER_DEGREE=$NEXT_PUBLIC_ENGINEER_DEGREE
            NEXT_PUBLIC_PHONE_PRIMARY=$NEXT_PUBLIC_PHONE_PRIMARY
            NEXT_PUBLIC_PHONE_SECONDARY=$NEXT_PUBLIC_PHONE_SECONDARY
            NEXT_PUBLIC_EMAIL=$NEXT_PUBLIC_EMAIL
            NEXT_PUBLIC_LOCATION_PRIMARY=$NEXT_PUBLIC_LOCATION_PRIMARY
            NEXT_PUBLIC_LOCATION_SECONDARY=$NEXT_PUBLIC_LOCATION_SECONDARY
            NEXT_PUBLIC_LOCATION_STATE=$NEXT_PUBLIC_LOCATION_STATE
            NEXT_PUBLIC_ADDRESS_STREET=$NEXT_PUBLIC_ADDRESS_STREET
            NEXT_PUBLIC_ADDRESS_FULL=$NEXT_PUBLIC_ADDRESS_FULL
            NEXT_PUBLIC_INSTAGRAM_HANDLE=$NEXT_PUBLIC_INSTAGRAM_HANDLE
            NEXT_PUBLIC_INSTAGRAM_URL=$NEXT_PUBLIC_INSTAGRAM_URL
            NEXT_PUBLIC_YOUTUBE_HANDLE=$NEXT_PUBLIC_YOUTUBE_HANDLE
            NEXT_PUBLIC_YOUTUBE_URL=$NEXT_PUBLIC_YOUTUBE_URL
            NEXT_PUBLIC_WORKING_HOURS_WEEKDAY=$NEXT_PUBLIC_WORKING_HOURS_WEEKDAY
            NEXT_PUBLIC_WORKING_HOURS_SUNDAY=$NEXT_PUBLIC_WORKING_HOURS_SUNDAY
            NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
            NEXT_PUBLIC_FOUNDED_YEAR=$NEXT_PUBLIC_FOUNDED_YEAR
            RESEND_API_KEY=$RESEND_API_KEY
            RESEND_FROM_EMAIL=$RESEND_FROM_EMAIL
            RESEND_TO_EMAIL=$RESEND_TO_EMAIL
            GHCR_USERNAME=$GHCR_USERNAME
            GHCR_TOKEN=$GHCR_TOKEN
            EOF

            echo "Pulling latest Docker image..."

            docker compose pull

            echo "Starting application..."

            docker compose up -d

            echo "Cleaning old Docker images..."

            docker image prune -f

            echo "Deployment completed."

            docker compose ps